# edu.v2txt.cn — HTTPS 监听 52066（对外唯一端口）
server {
    listen 52066 ssl;
    http2 on;
    server_name edu.v2txt.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_stapling        off;

    client_max_body_size 300m;
    client_body_timeout  300s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    access_log /var/log/nginx/edu-access.log;
    error_log  /var/log/nginx/edu-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "edu-tutor-nginx-ok\n";
    }

    location /api/ {
        # P2 接入 edu-api 后启用
        default_type application/json;
        return 503 '{"detail":"api not deployed yet"}';
    }

    location / {
        default_type text/plain;
        return 200 "edu-tutor stub: TLS ok, host=$host port=$server_port\n";
    }
}
