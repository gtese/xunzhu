name: edu-tutor

networks:
  edu-net:
    name: edu-net
    driver: bridge

services:
  edu-postgres:
    image: pgvector/pgvector:pg16
    container_name: edu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1536m
    networks: [edu-net]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  edu-redis:
    image: redis:7-alpine
    container_name: edu-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks: [edu-net]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  edu-nginx:
    image: nginx:1.27-alpine
    container_name: edu-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:52066:52066"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./data/certbot:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    mem_limit: 128m
    networks: [edu-net]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

